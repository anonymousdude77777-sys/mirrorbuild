name: Build Mod JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Gradle and build
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          rm -f gradle/wrapper/gradle-wrapper.jar
          ./gradle-8.10/bin/gradle wrapper --gradle-version 8.10
          ./gradlew build

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirrorbuild-jar
          path: build/libs/mirrorbuild-*.jar
          if-no-files-found: error
